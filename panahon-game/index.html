<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    try {
      var isMobile = (window.innerWidth <= 768 || window.innerHeight <= 550);
      var s = localStorage.getItem('panahon_gui_scale');
      var mobOverride = localStorage.getItem('panahon_gui_scale_mobile_override');
      if (s) {
        var num = parseFloat(s);
        if (!isNaN(num)) {
          if (isMobile && num > 1.05 && !mobOverride) {
            num = 1.0;
          }
          document.documentElement.style.zoom = num;
        }
      }
    } catch(e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="PANAHON: Chrono Shift - A cooperative and competitive tabletop time-travel game. Navigate portals, collect artifacts, and protect the timeline." />
  <meta name="theme-color" content="#0A0A12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PANAHON: Chrono Shift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Pirata+One&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
